  Local control panel for the Auto Job Applier. Vanilla HTML/CSS/JS only, no
  external libraries or network calls, works fully offline. It reads and writes
  only user_config.json (via the API in app.py) and never edits the config/*.py
  files.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auto Job Applier - Control Panel</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --card: #ffffff;
            --ink: #1f2733;
            --muted: #6b7684;
            --line: #dce1e8;
            --brand: #2563eb;
            --brand-dark: #1d4ed8;
            --ok: #16a34a;
            --warn: #b45309;
            --danger: #dc2626;
            --shadow: 0 1px 3px rgba(16,24,40,.08), 0 1px 2px rgba(16,24,40,.06);
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
        }
        header {
            background: var(--card);
            border-bottom: 1px solid var(--line);
            padding: 20px 24px;
        }
        header h1 { margin: 0 0 4px; font-size: 20px; }
        header p { margin: 0; color: var(--muted); font-size: 14px; }
        .wrap { width: 100%; max-width: 900px; margin: 0 auto; padding: 0 16px; }
        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 5;
        }
        nav button {
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            white-space: nowrap;
        }
        nav button:hover { color: var(--ink); }
        nav button.active { color: var(--brand); border-bottom-color: var(--brand); }
        /* Top margin so the first setting isn't flush against the tab bar, and a
           generous bottom gap so the fixed save bar never hides the last field.
           Uses main.wrap (not just main) so it beats the .wrap padding rule. */
        main.wrap { padding: 28px 16px 150px; }
        .panel { display: none; }
        .panel.active { display: block; }
        .field {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }
        .field label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        .field .help { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
        .field input[type=text],
        .field input[type=password],
        .field input[type=number],
        .field select,
        .field textarea {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: #fff;
            color: var(--ink);
        }
        .field textarea { min-height: 90px; resize: vertical; }
        .field input:focus, .field select:focus, .field textarea:focus {
            outline: none;
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(37,99,235,.15);
        }
        .checkline { display: flex; align-items: center; gap: 10px; }
        .checkline input[type=checkbox] { width: 20px; height: 20px; flex: none; accent-color: var(--brand); }
        .checkline label { margin: 0; }
        /* Password field with a show/hide eye button. */
        .pw-wrap { position: relative; }
        .pw-wrap input { padding-right: 46px; }
        .pw-eye {
            position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
            background: none; border: none; padding: 6px; margin: 0;
            display: inline-flex; align-items: center; justify-content: center;
            color: var(--muted); cursor: pointer; border-radius: 6px;
        }
        .pw-eye:hover { color: var(--ink); background: #eef1f6; }
        .pw-eye svg { display: block; }
        /* AI fields disabled while "Use AI" is off. */
        .field.disabled { opacity: .5; }
        .field.disabled input, .field.disabled select,
        .field.disabled textarea, .field.disabled .pw-eye { cursor: not-allowed; }
        /* Collapsible "Advanced options" section per tab. */
        details.advanced { margin: 4px 0 12px; }
        details.advanced > summary {
            cursor: pointer; user-select: none; list-style: none;
            font-weight: 600; font-size: 14px; color: var(--brand);
            padding: 11px 14px; background: var(--card);
            border: 1px solid var(--line); border-radius: 10px;
            box-shadow: var(--shadow);
        }
        details.advanced > summary::-webkit-details-marker { display: none; }
        details.advanced > summary::before { content: "\25B8\00a0\00a0"; }
        details.advanced[open] > summary::before { content: "\25BE\00a0\00a0"; }
        details.advanced > summary:hover { background: #f7f9fc; }
        details.advanced > .adv-body { padding-top: 12px; }
        .savebar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--card);
            border-top: 1px solid var(--line);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            justify-content: flex-end;
            box-shadow: 0 -1px 3px rgba(16,24,40,.06);
            z-index: 6;
        }
        .savebar .inner { width: 100%; max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
        .savebar .msg { margin-right: auto; font-size: 14px; color: var(--muted); }
        .savebar .msg.ok { color: var(--ok); }
        .savebar .msg.err { color: var(--danger); }
        button.btn {
            background: var(--brand);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button.btn:hover { background: var(--brand-dark); }
        button.btn:disabled { background: #9db4e8; cursor: not-allowed; }
        button.btn.secondary { background: #eef1f6; color: var(--ink); }
        button.btn.secondary:hover { background: #e2e7ef; }
        button.btn.danger { background: var(--danger); }
        button.btn.danger:hover { background: #b91c1c; }
        .note {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 14px;
            margin-bottom: 16px;
        }
        .runbox {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .status-line { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-weight: 600; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #cbd2dc; flex: none; }
        .dot.on { background: var(--ok); box-shadow: 0 0 0 4px rgba(22,163,74,.15); }
        .run-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
        .log {
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 10px;
            padding: 14px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12.5px;
            line-height: 1.5;
            max-height: 340px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 0;
        }
        .log-time { color: #94a3b8; }
        .log-match { background: #facc15; color: #111827; border-radius: 2px; }
        .log-controls { display: flex; gap: 8px; margin-bottom: 8px; }
        .log-controls input { flex: 1; min-width: 0; margin: 0; }
        .log-controls select { width: auto; min-width: 145px; }
        .log-entry { padding: 3px 0; border-bottom: 1px solid rgba(148,163,184,.16); }
        .log-entry:last-child { border-bottom: 0; }
        .log-entry-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px; }
        .log-badge { display: inline-block; border-radius: 4px; padding: 1px 6px; font: 700 11px/1.5 system-ui,sans-serif; }
        .log-badge.apply, .log-badge.success { color: #bbf7d0; background: #14532d; }
        .log-badge.review { color: #fde68a; background: #78350f; }
        .log-badge.skip, .log-badge.error { color: #fecaca; background: #7f1d1d; }
        .log-badge.action { color: #bfdbfe; background: #1e3a8a; }
        .log-job { font-weight: 700; color: #f8fafc; }
        .log-detail { margin: 5px 0 4px 72px; color: #cbd5e1; }
        .log-detail summary { color: #93c5fd; cursor: pointer; }
        .log-plain { white-space: pre-wrap; }
        .ai-prompt-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:10px 0; }
        .ai-prompt-card summary { cursor:pointer; font-weight:600; }
        .ai-prompt-card h3 { font-size:13px; margin:12px 0 4px; }
        .ai-prompt-card pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#f5f7fa; border-radius:6px; padding:10px; max-height:360px; overflow:auto; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
        .trace-toolbar { display:flex; flex-wrap:wrap; align-items:end; gap:8px; margin:12px 0; }
        .trace-toolbar label { display:flex; flex-direction:column; gap:3px; color:var(--muted); font-size:12px; }
        .trace-toolbar input, .trace-toolbar select { min-width:125px; max-width:100%; padding:8px 9px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--ink); font:inherit; }
        .trace-toolbar .trace-search { flex:1 1 230px; }
        .trace-toolbar .trace-search input { width:100%; }
        .trace-status { min-height:22px; color:var(--muted); font-size:13px; }
        .trace-group { background:var(--card); border:1px solid var(--line); border-radius:10px; margin:12px 0; box-shadow:var(--shadow); overflow:hidden; }
        .trace-group > summary { cursor:pointer; padding:12px 14px; font-weight:700; background:#f8fafc; }
        .trace-run { padding:0 12px 10px; }
        .trace-run > summary { cursor:pointer; padding:10px 2px; color:var(--muted); font-size:13px; }
        .trace-card { border-top:1px solid var(--line); padding:10px 2px; }
        .trace-card > summary { cursor:pointer; font-size:13px; font-weight:600; }
        .trace-meta { display:flex; flex-wrap:wrap; gap:6px 12px; color:var(--muted); font-size:12px; margin:5px 0; }
        .trace-pill { display:inline-block; border-radius:999px; padding:1px 8px; background:#eef1f6; color:#334155; font-size:11px; }
        .trace-detail { padding:4px 8px 8px; }
        .trace-detail h3 { font-size:13px; margin:12px 0 4px; }
        .trace-detail pre { white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; background:#f5f7fa; border:1px solid var(--line); border-radius:6px; padding:10px; max-height:420px; overflow:auto; margin:4px 0; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
        .trace-events { border-left:2px solid #cbd5e1; margin:8px 0 8px 5px; padding-left:12px; }
        .trace-event { position:relative; padding:5px 0 8px; }
        .trace-event::before { content:""; position:absolute; width:7px; height:7px; border-radius:50%; background:var(--brand); left:-17px; top:11px; }
        .trace-event time { color:var(--muted); font-size:11px; }
        .system-prompt-editor textarea { min-height:190px; font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
        h2.section-h { font-size: 16px; margin: 4px 0 14px; }
        table.jobs { border-collapse: collapse; width: 100%; font-size: 13px; }
        table.jobs th, table.jobs td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
        table.jobs th { background: #f1f4f8; font-weight: 600; }
        table.jobs tr:nth-child(even) { background: #fafbfc; }
        table.jobs a { color: var(--brand); text-decoration: none; }
        table.jobs a:hover { text-decoration: underline; }
        .tick { color: var(--ok); font-weight: 700; }
        .muted-small { color: var(--muted); font-size: 13px; }
        .header-tools { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; }
        .model-status { font-size:13px; color:var(--muted); }
        .model-status strong { color:var(--ink); }

        /* --- Responsive --- */
        @media (max-width: 640px) {
            header { padding: 16px 16px; }
            header h1 { font-size: 18px; }
            .wrap { padding: 0 12px; }
            .log-controls { flex-direction: column; }
            .log-controls select { width: 100%; }
            /* Tab bar scrolls sideways instead of wrapping into tall rows. */
            nav { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
            nav button { padding: 11px 12px; font-size: 13px; }
            main.wrap { padding: 22px 12px 184px; }
            .savebar { padding: 10px 12px; }
            .savebar .inner { flex-wrap: wrap; gap: 8px; }
            .savebar .msg { flex-basis: 100%; margin: 0; }
            .savebar .btn { flex: 1 1 auto; }
        }
    </style>
</head>
<body>
    <header>
        <div class="wrap">
            <h1>Auto Job Applier - Control Panel</h1>
            <p>Nothing is uploaded - your details are saved only on this computer.</p>
            <div class="header-tools">
                <div class="model-status">
                    <div id="botStatus" role="status" aria-live="polite">Automation: checking…</div>
                    <div id="modelStatus" role="status" aria-live="polite">Local model: checking…</div>
                </div>
                <button class="btn" id="quickRunBtn" type="button">Run automation</button>
            </div>
        </div>
    </header>

    <nav id="tabs" class="wrap"></nav>

    <main class="wrap">
        <div id="panels"></div>
    </main>

    <div class="savebar" id="savebar">
        <div class="inner">
            <span class="msg" id="saveMsg">Make your changes across the tabs, then click Save.</span>
            <button class="btn secondary" id="reloadBtn" type="button">Reload</button>
            <button class="btn" id="saveBtn" type="button">Save</button>
        </div>
    </div>

    <script>
        // ---- icons ----
        var EYE_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        var EYE_OFF_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

        // ---- state ----
        var SCHEMA = [];
        var CONFIG = {};        // {config_module: {key: value}}
        var BASELINE = {};      // JSON snapshot for change detection
        var MODEL_FIELDS = [];  // [{datalistId, models}] for provider-aware model lists
        var activeTab = null;
        var logOffset = 0;
        var logLines = [];
        var logPending = '';
        var expandedLogEntries = {};
        var pollTimer = null;
        var modelPollAt = 0;

        // ---- helpers ----
        function el(tag, attrs, children) {
            var node = document.createElement(tag);
            if (attrs) {
                for (var k in attrs) {
                    if (k === 'text') { node.textContent = attrs[k]; }
                    else if (k === 'html') { node.innerHTML = attrs[k]; }
                    else { node.setAttribute(k, attrs[k]); }
                }
            }
            (children || []).forEach(function (c) { if (c) node.appendChild(c); });
            return node;
        }

        function fieldId(field) { return 'f__' + field.config_module + '__' + field.key; }
        function datalistId(field) { return 'dl__' + field.config_module + '__' + field.key; }

        function currentValue(cm, key) {
            if (CONFIG[cm] && Object.prototype.hasOwnProperty.call(CONFIG[cm], key)) {
                return CONFIG[cm][key];
            }
            return '';
        }

        function asText(value) {
            return (value === null || value === undefined) ? '' : String(value);
        }

        // ---- rendering ----
        function makePasswordControl(id, value) {
            var wrap = el('div', { class: 'pw-wrap' });
            var input = el('input', { type: 'password', id: id });
            input.value = value;
            var btn = el('button', { type: 'button', class: 'pw-eye', 'aria-label': 'Show password', html: EYE_SVG });
            btn.addEventListener('click', function () {
                if (input.disabled) return;
                if (input.type === 'password') {
                    input.type = 'text'; btn.innerHTML = EYE_OFF_SVG; btn.setAttribute('aria-label', 'Hide password');
                } else {
                    input.type = 'password'; btn.innerHTML = EYE_SVG; btn.setAttribute('aria-label', 'Show password');
                }
            });
            wrap.appendChild(input);
            wrap.appendChild(btn);
            return wrap;
        }

        function makeModelControl(field, value) {
            var wrap = el('div', {});
            var input = el('input', { type: 'text', id: fieldId(field), list: datalistId(field), autocomplete: 'off' });
            input.value = value;
            var dl = el('datalist', { id: datalistId(field) });
            wrap.appendChild(input);
            wrap.appendChild(dl);
            MODEL_FIELDS.push({ datalistId: datalistId(field), models: field.models_by_provider || {} });
            return wrap;
        }

        function renderControl(field) {
            var value = currentValue(field.config_module, field.key);
            var id = fieldId(field);
            if (field.type === 'bool') {
                var cb = el('input', { type: 'checkbox', id: id });
                if (value === true) cb.checked = true;
                return cb;
            }
            if (field.type === 'textarea') {
                var ta = el('textarea', { id: id });
                ta.value = asText(value);
                return ta;
            }
            if (field.type === 'select') {
                var sel = el('select', { id: id });
                (field.options || []).forEach(function (opt) {
                    var o = el('option', { value: opt, text: opt === '' ? '(leave unanswered)' : opt });
                    if (String(value) === String(opt)) o.selected = true;
                    sel.appendChild(o);
                });
                return sel;
            }
            if (field.type === 'list') {
                var li = el('input', { type: 'text', id: id });
                li.value = Array.isArray(value) ? value.join(', ') : asText(value);
                return li;
            }
            if (field.type === 'number') {
                var nu = el('input', { type: 'number', id: id, step: 'any' });
                nu.value = asText(value);
                return nu;
            }
            if (field.type === 'password') {
                return makePasswordControl(id, asText(value));
            }
            if (field.models_by_provider) {
                return makeModelControl(field, asText(value));
            }
            var t = el('input', { type: 'text', id: id });
            t.value = asText(value);
            return t;
        }

        function renderField(field) {
            var control = renderControl(field);
            var box = el('div', { class: 'field' });
            box.dataset.cm = field.config_module;
            box.dataset.key = field.key;
            if (field.ai) box.dataset.ai = '1';
            if (field.type === 'bool') {
                var line = el('div', { class: 'checkline' });
                line.appendChild(control);
                line.appendChild(el('label', { for: fieldId(field), text: field.label }));
                box.appendChild(line);
                if (field.help) box.appendChild(el('p', { class: 'help', text: field.help }));
            } else {
                box.appendChild(el('label', { for: fieldId(field), text: field.label }));
                if (field.help) box.appendChild(el('p', { class: 'help', text: field.help }));
                box.appendChild(control);
            }
            return box;
        }

        function buildTabs() {
            var tabs = document.getElementById('tabs');
            var panels = document.getElementById('panels');
            tabs.innerHTML = '';
            panels.innerHTML = '';
            MODEL_FIELDS = [];

            SCHEMA.forEach(function (section) {
                var btn = el('button', { type: 'button', text: section.section });
                btn.addEventListener('click', function () { showTab(section.section); });
                btn.dataset.tab = section.section;
                tabs.appendChild(btn);

                var panel = el('div', { class: 'panel' });
                panel.dataset.tab = section.section;

                var common = section.fields.filter(function (f) { return !f.advanced; });
                var advanced = section.fields.filter(function (f) { return f.advanced; });

                common.forEach(function (field) { panel.appendChild(renderField(field)); });

                if (advanced.length) {
                    var det = el('details', { class: 'advanced' });
                    det.appendChild(el('summary', { text: 'Advanced options' }));
                    var body = el('div', { class: 'adv-body' });
                    advanced.forEach(function (field) { body.appendChild(renderField(field)); });
                    det.appendChild(body);
                    panel.appendChild(det);
                }

                panels.appendChild(panel);
            });

            // Extra "Run" tab (not part of the config schema).
            var runBtn = el('button', { type: 'button', text: 'Run' });
            runBtn.dataset.tab = 'Run';
            runBtn.addEventListener('click', function () { showTab('Run'); });
            tabs.appendChild(runBtn);
            panels.appendChild(buildRunPanel());

            var aiLogBtn = el('button', { type: 'button', text: 'AI Prompts' });
            aiLogBtn.dataset.tab = 'AI Prompts';
            aiLogBtn.addEventListener('click', function () {
                showTab('AI Prompts'); loadSystemPrompts(); refreshAIPrompts(true);
            });
            tabs.appendChild(aiLogBtn);
            panels.appendChild(buildAIPromptsPanel());

            var aiTracesBtn = el('button', { type: 'button', text: 'AI Traces' });
            aiTracesBtn.dataset.tab = 'AI Traces';
            aiTracesBtn.addEventListener('click', function () { showTab('AI Traces'); refreshAITraces(true); });
            tabs.appendChild(aiTracesBtn);
            panels.appendChild(buildAITracesPanel());

            wireAi();
            updateModelLists();
            applyAiState();

            showTab(SCHEMA.length ? SCHEMA[0].section : 'Run');
        }

        function showTab(name) {
            activeTab = name;
            document.querySelectorAll('#tabs button').forEach(function (b) {
                b.classList.toggle('active', b.dataset.tab === name);
            });
            document.querySelectorAll('#panels .panel').forEach(function (p) {
                p.classList.toggle('active', p.dataset.tab === name);
            });
            var isRun = (name === 'Run');
            document.getElementById('savebar').style.display = isRun ? 'none' : 'flex';
            if (isRun) { refreshStatus(); refreshLogs(); loadAppliedJobs(); loadUnresolvedQuestions(); loadCommentDrafts(); }
            if (name === 'AI Traces') refreshAITraces(false);
        }

        // ---- AI master switch + model lists ----
        function useAiEnabled() {
            var cb = document.getElementById('f__secrets__use_AI');
            return cb ? cb.checked : false;
        }

        function applyAiState() {
            var enabled = useAiEnabled();
            document.querySelectorAll('.field[data-ai="1"]').forEach(function (box) {

         *      parsed_output,decision,final_decision,latency_ms,error,retry_count},
         *      events:[{sequence,timestamp,type,label,tool_name,arguments,result,details}]}.

        function renderTraceDetail(container, payload, summary) {
            payload = payload || {}; var trace = payload.trace || payload.item || payload;
            var events = Array.isArray(payload.events) ? payload.events : (Array.isArray(trace.events) ? trace.events : []);
            function section(title, value) {
                if (value === undefined || value === null || value === '') return;
                container.appendChild(el('h3', { text: title }));
                var content = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
                container.appendChild(el('pre', { text: content }));
            }
            if (trace.candidate_context !== undefined) section('Candidate context', trace.candidate_context);
            section('Complete prompt', trace.prompt || trace.complete_prompt);
            section('Raw response', trace.raw_response || trace.response);
            section('Parsed output', trace.parsed_output);
            section('Final decision', trace.final_decision || trace.decision || traceDecision(summary));
            section('Error', trace.error);
            if (trace.latency_ms != null || trace.retry_count != null || trace.retry_info != null) {
                section('Latency and retries', { latency_ms: trace.latency_ms, retry_count: trace.retry_count, retry_info: trace.retry_info });
            }
            if (events.length) {
                container.appendChild(el('h3', { text: 'Tool calls and workflow events' }));
                var timeline = el('div', { class: 'trace-events' });
                events.slice().sort(function (a, b) { return Number(a.sequence || 0) - Number(b.sequence || 0); }).forEach(function (event) {
                    var row = el('div', { class: 'trace-event' });
                    row.appendChild(el('strong', { text: (event.type === 'tool_call' || event.type === 'tool' ? 'Tool call' : event.type === 'workflow' ? 'Workflow operation' : event.type || 'Event') + ': ' + (event.label || event.tool_name || event.name || 'Event') }));
                    if (event.timestamp) row.appendChild(el('div', { text: new Date(event.timestamp).toLocaleString() }));
                    if (event.arguments !== undefined) sectionInto(row, 'Arguments', event.arguments);
                    if (event.result !== undefined) sectionInto(row, 'Result', event.result);
                    if (event.details !== undefined) sectionInto(row, 'Details', event.details);
                    timeline.appendChild(row);
                }); container.appendChild(timeline);
            }
            if (!container.childNodes.length) container.appendChild(el('p', { class: 'muted-small', text: 'No additional trace details were returned.' }));
        }
        function sectionInto(container, title, value) {
            container.appendChild(el('div', { class: 'muted-small', text: title }));
            container.appendChild(el('pre', { text: typeof value === 'string' ? value : JSON.stringify(value, null, 2) }));
        }
        function exportAITraces() {
            var button = document.querySelector('#panels [data-tab="AI Traces"] .trace-toolbar button:last-child');
            var status = document.getElementById('traceStatus'); if (button) button.disabled = true;
            var requests = aiTraceItems.map(function (item) {
                return fetch('/api/ai-traces/' + encodeURIComponent(String(item.trace_id || '')), { headers: { 'Accept': 'application/json' } })
                    .then(function (response) { if (!response.ok) throw new Error('Export failed'); return response.json(); });
            });
            Promise.all(requests).then(function (details) {
                var blob = new Blob([JSON.stringify(details, null, 2)], { type: 'application/json' });
                var link = document.createElement('a'); link.href = URL.createObjectURL(blob);
                link.download = 'ai-traces-' + new Date().toISOString().replace(/[:.]/g, '-') + '.json';
                var downloadUrl = link.href;
                document.body.appendChild(link); link.click(); link.remove();
                setTimeout(function () { URL.revokeObjectURL(downloadUrl); }, 1000);
                if (status) status.textContent = 'Exported ' + details.length + ' complete trace' + (details.length === 1 ? '' : 's') + '.';
            }).catch(function () { if (status) status.textContent = 'Could not export all visible traces.'; })
                .finally(function () { if (button) button.disabled = false; });
        }

        function setRunningUI(running, pid, state) {
            state = running ? (state || 'running') : 'stopped';
            var quickRunBtn = document.getElementById('quickRunBtn');
            var botStatus = document.getElementById('botStatus');
            var dot = document.getElementById('statusDot');
            var text = document.getElementById('statusText');
            var startBtn = document.getElementById('startBtn');
            var pauseBtn = document.getElementById('pauseBtn');
            var stopBtn = document.getElementById('stopBtn');
            if (quickRunBtn) {
                quickRunBtn.disabled = running;
                quickRunBtn.textContent = running ? 'Automation running' : 'Run automation';
            }
            if (botStatus) botStatus.textContent = 'Automation: ' + state +
                (running && pid ? ' · process ' + pid : '');
            if (!dot) return;
            if (running) {
                dot.classList.add('on');
                text.textContent = (state === 'pausing' ? 'Pausing…' : state === 'paused' ? 'Paused' : 'Running') +
                    (pid ? ' (process ' + pid + ')' : '');
                if (startBtn) startBtn.disabled = true;
                if (pauseBtn) {
                    pauseBtn.disabled = state === 'pausing' || state === 'resuming';
                    pauseBtn.textContent = state === 'paused' ? 'Resume' : state === 'pausing' ? 'Pausing…' :
                        state === 'resuming' ? 'Resuming…' : 'Pause';
                }
                if (stopBtn) stopBtn.disabled = false;
            } else {
                dot.classList.remove('on');
                text.textContent = 'Not running';
                if (startBtn) startBtn.disabled = false;
                if (pauseBtn) { pauseBtn.disabled = true; pauseBtn.textContent = 'Pause'; }
                if (stopBtn) stopBtn.disabled = true;
            }
        }

        function refreshLogs() {
            fetch('/api/logs?offset=' + logOffset).then(function (r) { return r.json(); })
                .then(function (data) {
                    if (typeof data.next_offset === 'number' && data.next_offset < logOffset) {
                        // Log was truncated; reset the pane.
                        logOffset = 0;
                        logLines = [];
                        logPending = '';
                        expandedLogEntries = {};
                    }
                    if (data.content) {
                        appendLogContent(data.content);
                        renderLogs();
                    }
                    if (typeof data.next_offset === 'number') logOffset = data.next_offset;
                })
                .catch(function () {});
        }

        function appendLogContent(content) {
            var parts = (logPending + content).split(/\r?\n/);
            logPending = parts.pop();
            parts.forEach(function (line) {
                logLines.push({ time: new Date(), text: line });
            });
            // Keep the in-page view bounded during long runs.
            if (logLines.length > 10000) logLines.splice(0, logLines.length - 10000);
        }

        function appendHighlightedText(container, text, query) {
            if (!query) {
                container.appendChild(document.createTextNode(text));
                return;
            }
            var lowerText = text.toLowerCase();
            var lowerQuery = query.toLowerCase();
            var from = 0;
            var found = lowerText.indexOf(lowerQuery, from);
            while (found !== -1) {
                container.appendChild(document.createTextNode(text.slice(from, found)));
                var mark = document.createElement('mark');
                mark.className = 'log-match';
                mark.textContent = text.slice(found, found + query.length);
                container.appendChild(mark);
                from = found + query.length;
                found = lowerText.indexOf(lowerQuery, from);
            }
            container.appendChild(document.createTextNode(text.slice(from)));
        }

        function logEntryKind(text) {
            var decision = text.match(/^Suitability (APPLY|REVIEW|SKIP)(?:\s|\()/i);
            if (decision) return decision[1].toLowerCase();
            if (/application was sent|confirmed the application|submitted application|opening easy apply/i.test(text)) return 'application';
            if (/question|saved answer|no verified answer|draft saved/i.test(text)) return 'question';
            return 'other';
        }

        function appendLogEntry(fragment, line, index, query) {
            var row = document.createElement('div');
            row.className = 'log-entry';
            var head = document.createElement('div');
            head.className = 'log-entry-head';
            var timestamp = document.createElement('span');
            timestamp.className = 'log-time';
            timestamp.textContent = '[' + line.time.toLocaleTimeString() + ']';
            head.appendChild(timestamp);

            var decision = line.text.match(/^Suitability (APPLY|REVIEW|SKIP)(?: \((\d+)\/100\))?:\s*(.*)$/i);
            if (decision) {
                var badge = document.createElement('span');
                badge.className = 'log-badge ' + decision[1].toLowerCase();
                badge.textContent = decision[1].toUpperCase() + (decision[2] ? ' · ' + decision[2] + '/100' : '');
                head.appendChild(badge);
                var job = document.createElement('span');
                job.className = 'log-job';
                var description = decision[3];
                var reasonStart = description.indexOf(':');
                appendHighlightedText(job, reasonStart < 0 ? description : description.slice(0, reasonStart), query);
                head.appendChild(job);
                row.appendChild(head);
                var reasonText = reasonStart < 0 ? '' : description.slice(reasonStart + 1).trim();
                if (reasonText) {
                    var details = document.createElement('details');
                    details.className = 'log-detail';
                    details.open = !!expandedLogEntries[index];
                    details.addEventListener('toggle', function () { expandedLogEntries[index] = details.open; });
                    var summary = document.createElement('summary');
                    summary.textContent = 'Decision rationale';
                    details.appendChild(summary);
                    var reason = document.createElement('div');
                    reason.style.marginTop = '4px';
                    appendHighlightedText(reason, reasonText, query);
                    details.appendChild(reason);
                    row.appendChild(details);
                }
                fragment.appendChild(row);
                return;
            }

            var kind = logEntryKind(line.text);
            if (kind === 'application' || kind === 'question') {
                var actionBadge = document.createElement('span');
                actionBadge.className = 'log-badge ' + (kind === 'application' ? 'success' : 'action');
                actionBadge.textContent = kind === 'application' ? 'APPLICATION' : 'QUESTION';
                head.appendChild(actionBadge);
            }
            var content = document.createElement('span');
            content.className = 'log-plain';
            appendHighlightedText(content, line.text, query);
            head.appendChild(content);
            row.appendChild(head);
            fragment.appendChild(row);
        }

        function renderLogs() {
            var pane = document.getElementById('logPane');
            if (!pane) return;
            var filter = (document.getElementById('logFilter').value || '').trim().toLowerCase();
            var kindFilter = document.getElementById('logKindFilter').value;
            var lines = logLines.slice();
            if (logPending) lines.push({ time: new Date(), text: logPending });
            var matches = lines.map(function (line, index) { return { line: line, index: index }; }).filter(function (entry) {
                var matchesText = !filter || entry.line.text.toLowerCase().indexOf(filter) !== -1;
                var kind = logEntryKind(entry.line.text);
                return matchesText && (kindFilter === 'all' || kind === kindFilter);
            });
            var atBottom = pane.scrollTop + pane.clientHeight >= pane.scrollHeight - 20;
            pane.textContent = '';
            if (!matches.length) {
                pane.textContent = (filter || kindFilter !== 'all') ? 'No matching activity.' : 'No activity yet.';
            } else {
                var fragment = document.createDocumentFragment();
                matches.forEach(function (entry) {
                    appendLogEntry(fragment, entry.line, entry.index, filter);
                });
                pane.appendChild(fragment);
            }
            var count = document.getElementById('logFilterCount');
            if (count) count.textContent = (filter || kindFilter !== 'all') ? (matches.length + ' matching entries · ' + lines.length + ' total') : '';
            if (atBottom) pane.scrollTop = pane.scrollHeight;
        }

        function loadUnresolvedQuestions() {
            var holder = document.getElementById('questionsHolder');
            if (!holder) return;
            fetch('/api/unresolved-questions').then(function (r) { return r.json(); }).then(function (items) {
                holder.innerHTML = '';
                if (!Array.isArray(items) || !items.length) {
                    holder.appendChild(el('p', { class: 'muted-small', text: 'No unanswered questions recorded.' }));
                    return;
                }
                items.forEach(function (item) {
                    var row = el('div', { class: 'field' });
                    row.appendChild(el('p', { text: item.question }));
                    var answer = el('input', { type: 'text', placeholder: 'Your verified answer', 'aria-label': 'Answer for ' + item.question });
                    var unit = el('input', { type: 'text', placeholder: 'Unit, if applicable', 'aria-label': 'Unit for ' + item.question });
                    var save = el('button', { class: 'btn secondary', type: 'button', text: 'Save answer' });
                    var message = el('span', { class: 'muted-small' });
                    save.addEventListener('click', function () {
                        if (!answer.value.trim()) { message.textContent = ' Enter an answer first.'; return; }
                        save.disabled = true;
                        fetch('/api/candidate-answers', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ question: item.question, answer: answer.value.trim(), unit: unit.value.trim() }) })
                            .then(function (r) { if (!r.ok) throw new Error('save'); loadUnresolvedQuestions(); })
                            .catch(function () { save.disabled = false; message.textContent = ' Could not save the answer.'; });

                    row.appendChild(answer); row.appendChild(unit); row.appendChild(save); row.appendChild(message);
                    holder.appendChild(row);

            }).catch(function () { holder.textContent = 'Could not load unanswered questions.'; });

        function loadCommentDrafts() {
            var holder = document.getElementById('commentDraftsHolder');

            fetch('/api/comment-drafts').then(function (r) { return r.json(); }).then(function (drafts) {
                holder.textContent = '';

                    holder.appendChild(el('p', { class: 'muted-small', text: 'No comment drafts yet.' }));

                        card.appendChild(el('span', { text: (draft.author ? draft.author + ' · ' : '') +

                            .catch(function () { skip.textContent = 'Try again'; });

                    actions.appendChild(skip);

        function scanLinkedInFeed() {
            var button = document.getElementById('scanFeedBtn');
            var message = document.getElementById('feedScanMessage');
            var results = document.getElementById('feedScanResults');
            button.disabled = true;
            message.textContent = 'Opening LinkedIn. For each post: expand it, check relevance with AI, comment if relevant, then continue (up to 15 posts). Complete any verification prompt in Chrome…';
            results.textContent = '';
            refreshFeedDiagnostics();
            var diagnosticsTimer = setInterval(refreshFeedDiagnostics, 1200);
            fetch('/api/linkedin-feed/scan', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ limit: 15, scrolls: 5 })
            }).then(function (r) {
                return r.json().then(function (data) { if (!r.ok) throw new Error(data.error || 'Feed scan failed'); return data; });
            }).then(function (data) {
                if (data.needs_login) {
                    message.textContent = 'Sign-in did not finish within 3 minutes. Complete it in the Chrome window, then click Scan feed posts to try again.';
                    return;
                }
                message.textContent = data.scanned_count ? ('Checked ' + data.scanned_count + ' posts; posted ' + data.posted_count + ' comments.' + (data.halted ? ' Stopped because a relevant comment could not be completed; no later posts were processed.' : '') + ' Review each result below.') : 'No readable posts found. LinkedIn may have changed its feed layout.';
                (data.results || []).forEach(function (post) {
                    var card = el('article', { class: 'panel' });

                    if (post.comment) card.appendChild(el('pre', { text: post.comment }));
                    results.appendChild(card);

                .finally(function () { button.disabled = false; clearInterval(diagnosticsTimer); refreshFeedDiagnostics(); });
        }

                var thead = el('thead');
                var hr = el('tr');
                ['#', 'Job Title', 'Company', 'HR Contact', 'Link', 'Applied'].forEach(function (h) {
                    hr.appendChild(el('th', { text: h }));
                });
                thead.appendChild(hr);
                table.appendChild(thead);
                var tbody = el('tbody');
                jobs.forEach(function (job, i) {
                    var tr = el('tr');
                    tr.appendChild(el('td', { text: String(i + 1) }));
                    var titleCell = el('td');
                    if (job.Job_Link) {
                        titleCell.appendChild(el('a', { href: job.Job_Link, target: '_blank', rel: 'noopener', text: job.Title || 'View' }));
                    } else { titleCell.textContent = job.Title || ''; }
                    tr.appendChild(titleCell);
                    tr.appendChild(el('td', { text: job.Company || '' }));
                    var hrCell = el('td');
                    if (job.HR_Name && job.HR_Name !== 'Unknown' && job.HR_Link) {
                        hrCell.appendChild(el('a', { href: job.HR_Link, target: '_blank', rel: 'noopener', text: job.HR_Name }));
                    } else { hrCell.textContent = 'N/A'; }
                    tr.appendChild(hrCell);
                    var linkCell = el('td');
                    if (job.External_Job_link === 'Easy Applied') {
                        linkCell.textContent = 'Easy Applied';
                    } else if (job.External_Job_link) {
                        linkCell.appendChild(el('a', { href: job.External_Job_link, target: '_blank', rel: 'noopener', text: 'External' }));
                    } else { linkCell.textContent = 'N/A'; }
                    tr.appendChild(linkCell);
                    var appliedCell = el('td');
                    if (job.External_Job_link === 'Easy Applied' || (job.Date_Applied && job.Date_Applied !== 'Pending')) {
                        appliedCell.innerHTML = '<span class="tick">&#10003;</span>';
                    }
                    tr.appendChild(appliedCell);
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                holder.innerHTML = '';
                holder.appendChild(table);
            }).catch(function () {
                holder.innerHTML = '';
                holder.appendChild(el('p', { class: 'muted-small', text: 'Could not load history.' }));
            });
        }

        // ---- save / load config ----
        function readControlValue(field) {
            var node = document.getElementById(fieldId(field));
            if (!node) return undefined;
            if (field.type === 'bool') return node.checked;
            if (field.type === 'list') {
                return node.value.split(',').map(function (s) { return s.trim(); })
                    .filter(function (s) { return s !== ''; });
            }
            if (field.type === 'number') {
                var t = node.value.trim();
                if (t === '') return undefined; // leave unchanged, avoid server error
                var n = Number(t);
                return isNaN(n) ? undefined : n;
            }
            return node.value;
        }

        function baselineValue(cm, key) {
            if (BASELINE[cm] && Object.prototype.hasOwnProperty.call(BASELINE[cm], key)) {
                return BASELINE[cm][key];
            }
            return undefined;
        }

        function saveConfig() {
            var payload = {};
            var changed = 0;
            SCHEMA.forEach(function (section) {
                section.fields.forEach(function (field) {
                    var current = readControlValue(field);
                    if (current === undefined) return;
                    var base = baselineValue(field.config_module, field.key);
                    if (JSON.stringify(current) !== JSON.stringify(base)) {
                        if (!payload[field.config_module]) payload[field.config_module] = {};
                        payload[field.config_module][field.key] = current;
                        changed++;
                    }
                });
            });

            var msg = document.getElementById('saveMsg');
            if (changed === 0) {
                msg.className = 'msg';
                msg.textContent = 'Nothing to save - no changes yet.';
                return;
            }
            var btn = document.getElementById('saveBtn');
            btn.disabled = true;
            msg.className = 'msg';
            msg.textContent = 'Saving...';
            fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(function (r) {
                return r.json().then(function (body) { return { ok: r.ok, body: body }; });
            }).then(function (res) {
                btn.disabled = false;
                if (!res.ok) {
                    msg.className = 'msg err';
                    msg.textContent = 'Could not save: ' + (res.body && res.body.error ? res.body.error : 'unknown error');
                    return;
                }
                CONFIG = mergeIntoConfig(res.body);
                BASELINE = JSON.parse(JSON.stringify(CONFIG));
                msg.className = 'msg ok';
                msg.textContent = 'Saved ' + changed + (changed === 1 ? ' change.' : ' changes.');
            }).catch(function (err) {
                btn.disabled = false;
                msg.className = 'msg err';
                msg.textContent = 'Could not save: ' + err;
            });
        }

        function mergeIntoConfig(saved) {
            // saved is the full user_config.json. Overlay it onto the effective CONFIG.
            var merged = JSON.parse(JSON.stringify(CONFIG));
            for (var cm in saved) {
                if (!merged[cm]) merged[cm] = {};
                for (var key in saved[cm]) { merged[cm][key] = saved[cm][key]; }
            }
            return merged;
        }

        function loadAll() {
            Promise.all([
                fetch('/api/schema').then(function (r) { return r.json(); }),
                fetch('/api/config').then(function (r) { return r.json(); })
            ]).then(function (results) {
                SCHEMA = results[0];
                CONFIG = results[1] || {};
                BASELINE = JSON.parse(JSON.stringify(CONFIG));
                buildTabs();
            }).catch(function (err) {
                document.getElementById('panels').innerHTML =
                    '<p style="color:#dc2626">Could not load settings from the app. Is it still running? (' + err + ')</p>';
            });
        }

        document.getElementById('saveBtn').addEventListener('click', saveConfig);
        document.getElementById('reloadBtn').addEventListener('click', function () {
            document.getElementById('saveMsg').textContent = 'Reloading saved settings...';
            loadAll();
        });

        loadAll();
        pollLoop();
    </script>
</body>
</html>
